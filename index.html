<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือสร้าง QR Code</title>
    <!-- โหลด Tailwind CSS เพื่อความสวยงามและการจัดหน้าแบบ Responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดไลบรารี QRCode.js สำหรับสร้าง QR Code บนฝั่งผู้ใช้ (Client-side) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* จัดให้รูปภาพ QR Code อยู่ตรงกลางเสมอ */
        #qrcode img, #qrcode canvas {
            margin: auto;
            border-radius: 8px; /* เพิ่มความโค้งมนเล็กน้อยให้ QR Code */
        }
        
        /* สร้างแอนิเมชันตอนแสดงปุ่มดาวน์โหลด */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- การ์ดคอนเทนเนอร์หลัก -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center transition-all">
        
        <!-- ส่วนหัว -->
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">สร้าง QR Code ทันที</h1>
            <p class="text-gray-500 text-sm">กรอกลิงก์ URL ของคุณด้านล่าง ระบบจะสร้าง QR Code ให้โดยอัตโนมัติ</p>
        </div>

        <!-- ช่องกรอก URL -->
        <div class="mb-8">
            <input 
                type="url" 
                id="urlInput" 
                placeholder="https://www.example.com"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-gray-700 bg-gray-50 focus:bg-white"
            >
        </div>

        <!-- พื้นที่แสดง QR Code -->
        <div class="bg-gray-50 rounded-xl p-6 border border-dashed border-gray-300 mb-6 min-h-[240px] flex items-center justify-center flex-col">
            <div id="qrcode" class="w-[200px] h-[200px] flex items-center justify-center">
                <!-- ข้อความ Placeholder ก่อนพิมพ์ URL -->
                <span id="placeholderText" class="text-gray-400 text-sm">QR Code จะแสดงที่นี่</span>
            </div>
        </div>

        <!-- ปุ่มดาวน์โหลด (ซ่อนไว้เป็นค่าเริ่มต้น) -->
        <button 
            id="downloadBtn" 
            class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
            ดาวน์โหลด QR Code (PNG)
        </button>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('urlInput');
            const qrcodeContainer = document.getElementById('qrcode');
            const placeholderText = document.getElementById('placeholderText');
            const downloadBtn = document.getElementById('downloadBtn');
            
            let qrcode = null;
            let timeoutId = null;

            // ฟังก์ชันสำหรับสร้าง QR Code
            function generateQRCode(text) {
                // ซ่อนข้อความ Placeholder
                if (placeholderText) placeholderText.style.display = 'none';

                // ลบ QR Code เดิมทิ้งก่อนสร้างใหม่
                qrcodeContainer.innerHTML = '';
                
                // สร้างออบเจ็กต์ QRCode ใหม่ (ขนาด 200x200 ตามโจทย์)
                qrcode = new QRCode(qrcodeContainer, {
                    text: text,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H // ระดับการแก้ข้อผิดพลาดสูงสุด (ช่วยให้สแกนง่าย)
                });

                // แสดงปุ่มดาวน์โหลดพร้อมแอนิเมชัน
                downloadBtn.classList.remove('hidden');
                downloadBtn.classList.add('fade-in');
            }

            // รับฟังเหตุการณ์การพิมพ์ในช่อง Input
            urlInput.addEventListener('input', (e) => {
                const text = e.target.value.trim();

                // ป้องกันการสร้าง QR ถี่เกินไปขณะกำลังพิมพ์ (Debounce 300ms)
                clearTimeout(timeoutId);

                timeoutId = setTimeout(() => {
                    if (text) {
                        generateQRCode(text);
                    } else {
                        // กรณีช่องกรอกว่างเปล่า ให้คืนค่าเริ่มต้น
                        qrcodeContainer.innerHTML = '';
                        qrcodeContainer.appendChild(placeholderText);
                        placeholderText.style.display = 'block';
                        downloadBtn.classList.add('hidden');
                        downloadBtn.classList.remove('fade-in');
                    }
                }, 300);
            });

            // ฟังก์ชันสำหรับดาวน์โหลด QR Code เป็นรูปภาพ
            downloadBtn.addEventListener('click', () => {
                // ค้นหา Element Canvas ที่ไลบรารีสร้างขึ้นมา
                const canvas = qrcodeContainer.querySelector('canvas');
                
                if (canvas) {
                    // แปลง Canvas เป็น Data URL ชนิด PNG
                    const imageURL = canvas.toDataURL("image/png");
                    
                    // สร้างแท็ก <a> จำลองเพื่อสั่งดาวน์โหลด
                    const downloadLink = document.createElement('a');
                    downloadLink.href = imageURL;
                    downloadLink.download = 'qrcode.png';
                    
                    // จำลองการคลิกเพื่อดาวน์โหลด
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                } else {
                    // Fallback กรณีไลบรารีสร้างเป็น <img> โดยตรง (ในเบราว์เซอร์เก่าบางรุ่น)
                    const img = qrcodeContainer.querySelector('img');
                    if(img && img.src) {
                        const downloadLink = document.createElement('a');
                        downloadLink.href = img.src;
                        downloadLink.download = 'qrcode.png';
                        document.body.appendChild(downloadLink);
                        downloadLink.click();
                        document.body.removeChild(downloadLink);
                    }
                }
            });
        });
    </script>
</body>
</html>
